
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game | Harsh Anand</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid;
    place-items: center; background: #101820;
    color: white; font-family: Arial, sans-serif;
  }
  .game { text-align: center; padding: 16px; width: 100%; }
  h1 { color: #90ee90; margin-bottom: 8px; }
  .score { margin: 12px; font-size: 20px; }
  canvas {
    background: #05090c; border: 2px solid #90ee90;
    width: min(600px, 94vw); height: auto;
    display: block; margin: 0 auto; touch-action: none;
  }
  button {
    background: #90ee90; border: 0; border-radius: 6px;
    padding: 10px 18px; margin: 10px 4px;
    cursor: pointer; font-weight: bold;
  }
  p { color: #cbd5e1; }
  .controls { margin: 8px auto; }
</style>
</head>
<body>
<div class="game">
  <h1>🐍 Snake Game</h1>
  <p>Eat the red food and avoid the walls!</p>
  <div class="score">Score: <span id="score">0</span></div>
  <canvas id="board" width="600" height="340"></canvas>
  <div>
    <button id="start">Start / Restart</button>
    <button id="pause">Pause</button>
  </div>
  <p>Arrow keys or WASD to move · Space to pause</p>
  <div class="controls">
    <button onclick="turn('up')">↑</button><br>
    <button onclick="turn('left')">←</button>
    <button onclick="turn('down')">↓</button>
    <button onclick="turn('right')">→</button>
  </div>
  <p id="message">Press Start to play!</p>
</div>
<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const cell = 20, cols = 30, rows = 17;
let snake, food, direction, nextDirection, score;
let running = false, paused = false, timer = null, over = false;

function reset() {
  clearInterval(timer);
  snake = [{x: 8, y: 8}, {x: 7, y: 8}, {x: 6, y: 8}];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0; over = false; paused = false; running = true;
  document.getElementById("score").textContent = score;
  document.getElementById("message").textContent = "Game on!";
  document.getElementById("pause").textContent = "Pause";
  placeFood(); draw();
  timer = setInterval(tick, 110);
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function turn(d) {
  const dirs = {
    up: {x:0,y:-1}, down:{x:0,y:1},
    left:{x:-1,y:0}, right:{x:1,y:0}
  };
  const v = dirs[d];
  if (v && v.x !== -direction.x && v.y !== -direction.y)
    nextDirection = v;
}

function tick() {
  if (!running || paused || over) return;
  direction = nextDirection;
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };
  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);

  if (head.x < 0 || head.x >= cols ||
      head.y < 0 || head.y >= rows ||
      body.some(s => s.x === head.x && s.y === head.y)) {
    over = true;
    running = false;
    document.getElementById("message").textContent =
      "Game Over! Press Start / Restart to play again.";
    draw();
    return;
  }

  snake.unshift(head);
  if (eating) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = "#05090c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ff3030";
  ctx.fillRect(food.x * cell + 3, food.y * cell + 3,
               cell - 6, cell - 6);

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#c7ffc7" : "#90ee90";
    ctx.fillRect(s.x * cell + 1, s.y * cell + 1,
                 cell - 2, cell - 2);
  });

  if (paused || over) {
    ctx.fillStyle = "rgba(0,0,0,.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 28px Arial";
    ctx.fillText(over ? "GAME OVER" : "PAUSED",
                 canvas.width / 2, canvas.height / 2);
  }
}

function togglePause() {
  if (!running && !paused) return;
  paused = !paused;
  document.getElementById("pause").textContent =
    paused ? "Resume" : "Pause";
  document.getElementById("message").textContent =
    paused ? "Game paused" : "Game on!";
  draw();
}

document.addEventListener("keydown", e => {
  const keys = {
    ArrowUp:"up", w:"up", W:"up",
    ArrowDown:"down", s:"down", S:"down",
    ArrowLeft:"left", a:"left", A:"left",
    ArrowRight:"right", d:"right", D:"right"
  };
  if (keys[e.key]) {
    e.preventDefault();
    turn(keys[e.key]);
  }
  if (e.code === "Space") {
    e.preventDefault();
    togglePause();
  }
});

document.getElementById("start").addEventListener("click", reset);
document.getElementById("pause").addEventListener("click", togglePause);

snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
food = {x:18,y:8};
direction = {x:1,y:0};
nextDirection = {x:1,y:0};
score = 0;
draw();
</script>
</body>
</html>
